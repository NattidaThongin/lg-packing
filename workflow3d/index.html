<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LGPacking 3D Workflow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&family=Prompt:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* layout: 3 views (3D / vertical flow / swim lane). 3D view = step list | stage | phone replica of the real app */
:root{
  --bg:#f2f0ec; --panel:#ffffff; --fg:#1c232d; --muted:#5b6674; --line:#d8dce2;
  --accent:#2563eb; --accent-ink:#ffffff; --ok:#16883f; --ng:#d03636; --warn:#c8741c;
  --sky:#e9ecef; --floor:#cfd2d6; --wall:#dfe2e6; --zonea:#c3e3cc; --zoneb:#f3d9b0;
  --lane0:#e8f1f6; --lane1:#eef3ea; --lane2:#f5efe3; --lane3:#f6e9e9;
  --font:'Noto Sans Thai','Segoe UI',system-ui,sans-serif; --head:'Prompt','Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b; --panel:#1a2029; --fg:#e8ecf1; --muted:#9aa5b4; --line:#2c3440;
    --accent:#6c9bff; --accent-ink:#06142e; --ok:#4cc77a; --ng:#ff6b6b; --warn:#f0a050;
    --sky:#171c24; --floor:#363d47; --wall:#262c35; --zonea:#2a4533; --zoneb:#4a3a22;
    --lane0:#1b2a33; --lane1:#1d2a21; --lane2:#2c281c; --lane3:#2f2023; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b; --panel:#1a2029; --fg:#e8ecf1; --muted:#9aa5b4; --line:#2c3440;
  --accent:#6c9bff; --accent-ink:#06142e; --ok:#4cc77a; --ng:#ff6b6b; --warn:#f0a050;
  --sky:#171c24; --floor:#363d47; --wall:#262c35; --zonea:#2a4533; --zoneb:#4a3a22;
  --lane0:#1b2a33; --lane1:#1d2a21; --lane2:#2c281c; --lane3:#2f2023; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);margin:0;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:12px}
header h1{font-family:var(--head);font-size:clamp(20px,3vw,28px);margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:14px}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.views button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;gap:14px;grid-template-columns:200px minmax(0,1fr)}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;align-self:start}
@media (max-width:900px){.steps{flex-direction:row;overflow-x:auto;padding-bottom:6px;order:2}}
.steps button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:flex-start;padding:5px 8px;border-radius:8px;font-size:12.5px;line-height:1.35;color:var(--muted);width:100%;box-sizing:border-box}
@media (max-width:900px){.steps button{width:150px;flex:none;background:var(--panel);border:1px solid var(--line)}}
.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.steps .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--fg);font-size:12px;font-weight:700;display:grid;place-items:center}
.steps li.done .n{background:var(--ok);color:#fff}
.steps li.cur button{background:var(--panel);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--accent) inset}
.steps li.cur .n{background:var(--accent);color:var(--accent-ink)}
.right{display:grid;gap:10px;min-width:0}
.duo{display:flex;gap:12px;align-items:flex-start}
@media (max-width:820px){.duo{flex-direction:column;align-items:stretch}}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sky);height:620px;flex:1;min-width:0}
@media (max-width:820px){.stage{height:420px}}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
canvas:active{cursor:grabbing}
.lbl{position:absolute;left:0;top:0;pointer-events:none;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--fg);border:1px solid var(--line);white-space:nowrap;transform:translate(-50%,-50%)}
.hint{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--muted);background:var(--panel);padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.cap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px}
.cap h2{font-family:var(--head);font-size:17px;margin:0;text-wrap:balance}
.cap p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.cap .now{font-size:13px;color:var(--accent);font-weight:600;min-height:20px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl button,.ctl select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:7px 12px;border-radius:8px;cursor:pointer}
.ctl button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ctl button:focus-visible,.ctl select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ctl label{font-size:13px;display:flex;gap:6px;align-items:center;color:var(--muted)}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}

/* ===== phone: replica of the real handheld app (designed at 360x740 CSS px, scaled down) ===== */
.phone{position:relative;flex:none;width:300px;height:602px;border:7px solid #20252c;border-radius:34px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.28)}
@media (max-width:820px){.phone{align-self:center}}
.screen{position:absolute;left:0;top:0;width:360px;height:740px;transform:scale(.7944);transform-origin:0 0;background:#F7F8FA;color:#0B1220;overflow:hidden;font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;font-size:14px;line-height:1.4}
.screen *{box-sizing:border-box}
.tb{position:absolute;left:0;right:0;top:0;height:56px;background:#fff;border-bottom:1px solid #E2E7EE;box-shadow:0 1px 4px rgba(15,23,42,.06);display:flex;align-items:center;justify-content:center;z-index:2}
.tb .tt{color:#0F172A;font-weight:700;font-size:17px}
.tb .hb{position:absolute;left:12px;top:8px;width:40px;height:40px;display:grid;place-items:center;color:#4A5566}
.tb .av{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;background:#CBD2DC;color:#0B1220;font-weight:700;font-size:14px;display:grid;place-items:center}
.tb .up{position:absolute;right:12px;top:8px;height:40px;border:1px solid #E2E7EE;border-radius:999px;background:#fff;display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px}
.tb .up .a2{width:28px;height:28px;border-radius:50%;background:#CBD2DC;display:grid;place-items:center;font-size:12px;font-weight:700}
.tb .up b{font-size:13px;font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{position:absolute;left:0;right:0;top:56px;bottom:0;padding:12px;overflow:hidden}
.pin{transition:transform .8s ease}
.mt{display:flex;gap:4px;background:#EAF1FD;border-radius:10px;padding:3px;margin-bottom:12px}
.mt span{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:700;color:#475569;white-space:nowrap}
.mt span.on{background:#2563EB;color:#fff}
.tl{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;min-height:30px}
.lot{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:14px;color:#0F172A}
.pz{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #DC2626;color:#DC2626;background:#fff;font-weight:700;font-size:12.5px;padding:0 12px;height:30px;border-radius:999px}
.sum{display:flex;gap:14px;align-items:center;font-size:12.5px;color:#475569;font-weight:600;margin-bottom:12px;padding:0 2px}
.sum b{color:#0F172A}
.sc{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #EEF1F5;border-radius:12px;margin-bottom:10px;background:#fff;min-height:44px}
.sc.done{background:#F1F4F8;opacity:.6}
.chk{width:26px;height:26px;border-radius:50%;background:#E2E8F0;opacity:.8;flex:none;display:grid;place-items:center;color:#fff;font-size:15px;font-weight:700}
.chk.d{background:#1E9E5A;opacity:1}
.sc-b{flex:1;min-width:0}
.sc-t{font-weight:700;font-size:15px;color:#0F172A;font-family:'IBM Plex Mono',monospace;white-space:nowrap}
.sc-s{font-size:13px;color:#64748B;font-weight:700;margin-top:3px;white-space:nowrap}
.bin{flex:none;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 10px;border:2px solid #2563EB;background:#EFF6FF;color:#1E3A8A;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:800;line-height:1.15}
.bin small{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:#2563EB}
.sc.done .bin{border-color:#CBD5E1;background:#F1F4F8;color:#64748B}.sc.done .bin small{color:#94A3B8}
.wait{color:#DC2626;font-weight:700;font-size:12.5px;margin-top:2px}
.pc.blocked{background:#F1F4F8}
.chips{display:flex;flex-direction:column;gap:5px;flex:none;width:112px}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 8px;border-radius:8px;border:1.5px solid}
.chip i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.chip b{font-family:'IBM Plex Mono',monospace;margin-left:auto}
.chip.fg{color:#1D4ED8;border-color:#93C5FD;background:#EFF6FF}
.chip.pt{color:#C2410C;border-color:#FDBA74;background:#FFF3E8}
.os{background:#fff;border:1px solid #CBD2DC;border-radius:8px;padding:14px 12px 16px}
.oh{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.oh h2{margin:0;font-size:20px;letter-spacing:.02em}
.bars{height:34px;width:100%;margin-top:6px;background:repeating-linear-gradient(90deg,#000 0 2px,#fff 2px 4px,#000 4px 5px,#fff 5px 8px,#000 8px 11px,#fff 11px 13px)}
.bt{font-size:11px;letter-spacing:.05em;color:#4A5566}
.ims{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ims .c{font-size:20px;font-weight:800}
.ims .d{background:#EEF1F5;color:#0B1220;font-weight:600;border-radius:8px;padding:6px 12px;font-size:13px}
.cnt{margin:16px 0 10px;font-size:15px;font-weight:700}
.oc{display:flex;flex-direction:column;gap:14px;padding:16px;border:1px solid #E3E7EE;border-radius:12px;margin-bottom:14px;background:#fff}
.oc.hi{border-color:#2563EB;box-shadow:0 0 0 2px #BFDBFE}
.och{display:flex;align-items:flex-start;gap:14px}
.oci{flex:none;width:34px;height:34px;border-radius:8px;background:#EEF1F5;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
.oct{font-weight:700;font-size:18px}
.ocs{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px}
.ocs span{display:inline-flex;gap:4px;background:#EEF1F5;border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap}
.ocs em{font-style:normal;font-weight:700;color:#64748B}.ocs strong{font-weight:600}
.met{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding-top:12px;border-top:1px solid #EEF1F5}
.mm{text-align:center;background:#F8FAFC;border:1px solid #EEF1F5;border-radius:10px;padding:7px 6px}
.mm label{display:block;font-size:11px;font-weight:700;color:#64748B;margin-bottom:4px;line-height:1.25}
.mm span{font-weight:700;font-size:17px}
.mm.q{background:#EAF2FF;border-color:#BFDBFE}.mm.q label,.mm.q span{color:#0B5FBD}.mm.q span{font-size:19px}
.snp{display:flex;gap:6px}
.snp div{flex:1;background:#F8FAFC;border:1px solid #EEF1F5;border-radius:10px;padding:6px;text-align:center;font-size:12px;color:#64748B;font-weight:700}
.snp b{display:block;color:#0B1220;font-size:15px}
.olot{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#94A3B8}
.os2{background:#fff;border:1px solid #CBD2DC;border-radius:8px;padding:8px 12px 16px}
.h2o h2{margin:0;font-size:16px;letter-spacing:.02em;font-weight:700}
.cnt2{margin:8px 0 6px;font-size:13px;font-weight:700}
.oc2{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;margin-bottom:6px;border:1px solid #E3E7EE;border-radius:10px;background:#fff}
.oc2.hi{border-color:#2563EB;box-shadow:0 0 0 2px #BFDBFE}
.och2{display:flex;align-items:center;gap:10px;min-width:0}
.oci2{width:26px;height:26px;border-radius:6px;background:#EEF1F5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.oct2{font-weight:700;font-size:15px;word-break:break-all}
.oq{display:flex;align-items:baseline;gap:6px;padding:3px 10px;background:#EAF2FF;border:1px solid #BFDBFE;border-radius:10px;color:#0B5FBD}
.oq label{font-size:10px;font-weight:700}.oq span{font-size:16px;font-weight:700}
.acts{display:flex;gap:10px;margin-top:8px}
.adel{width:48px;height:48px;border:1px solid #DC2626;color:#DC2626;border-radius:10px;display:grid;place-items:center;background:#fff}
.aprint{flex:1;height:48px;background:#15803D;color:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.scw{padding-top:90px;text-align:center}
.st{font-family:'IBM Plex Sans',monospace;font-weight:700;letter-spacing:.08em;font-size:34px;margin:0 0 20px}
.sin{height:56px;border-bottom:1px solid #E2E7EE;font-family:'IBM Plex Sans',monospace;font-size:18px;display:flex;align-items:center;justify-content:center}
.sin.on{border-bottom-color:#2456a6}
.sin .ph{color:#98A1B0;font-size:16px}
.sbt{display:flex;gap:12px;margin-top:28px}
.sb{flex:1;height:52px;border-radius:10px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center}
.sb.p{background:#2456a6;color:#fff}
.sb.s{background:#fff;color:#2456a6;border:1px solid #2456a6}
.hc{background:#fff;border:1px solid #EEF1F5;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.hch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hl{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px}
.hd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#94A3B8}
.hbd{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px}
.hm{font-size:12.5px;color:#475569;display:flex;gap:14px;flex-wrap:wrap}
.hp{display:flex;gap:10px}
.hp div{flex:1;border-radius:10px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:2px}
.hp b{font-size:15px}
.ov{position:absolute;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.sheet{background:#fff;border-radius:18px;width:100%;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:flex-start}
.dh h3{margin:0;font-weight:800;font-size:22px;color:#0F172A}
.dh span{font-size:18px;width:30px;height:30px;display:grid;place-items:center}
.infr{display:flex;gap:10px}
.ib{flex:1 1 0;min-width:0;background:#F1F4F8;border-radius:12px;padding:10px 12px;font-size:12.5px;color:#64748B;font-weight:500;display:flex;align-items:center;gap:6px}
.ib b{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:#0F172A;font-weight:700}
.sbx{border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sbx.blue{background:#EAF3FF}.sbx.orange{background:#FFF3E8}.sbx.green{background:#E6F6EC}
.sbx .l{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#0F172A}
.sbx.blue .l{color:#2563EB}.sbx.orange .l{color:#EA580C}
.sbx .v{font-size:22px;font-weight:800;color:#0F172A;text-align:right}
.sbx .v small{display:block;font-size:12px;font-weight:600;color:#475569}
.bconfirm{background:#2563EB;color:#fff;font-weight:700;font-size:15px;padding:14px 18px;border-radius:999px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:8px}
.bconfirm.orange{background:#EA580C}
.breport{border:1.5px solid #DC2626;color:#DC2626;background:#fff;font-weight:700;font-size:14.5px;padding:12px 18px;border-radius:999px;min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px}
.full{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.full.wt{background:#F8FAFC}
.wi{width:84px;height:84px;border-radius:50%;background:#DBEAFE;color:#2563EB;display:flex;align-items:center;justify-content:center}
.wtt{color:#0F172A;font-size:17px;font-weight:700;margin:0}
.wtc{color:#2563EB;font-size:30px;font-weight:800;margin:0;line-height:1.1}
.wtm{color:#2563EB;font-size:12px;font-weight:700;letter-spacing:.06em;margin:0}
.dots3{display:flex;gap:7px}.dots3 span{width:8px;height:8px;border-radius:50%;background:#2563EB;animation:pul 1.2s ease-in-out infinite}
.dots3 span:nth-child(2){animation-delay:.15s}.dots3 span:nth-child(3){animation-delay:.3s}
@keyframes pul{0%,100%{opacity:.25;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
.back{margin-top:10px;border:1.5px solid #FACC15;background:#FEF9C3;color:#854D0E;font-size:14px;font-weight:700;padding:11px 22px;border-radius:10px}
.full.ok{background:#059669;color:#fff}.full.ng{background:#DC2626;color:#fff}
.full .big{font-weight:800;font-size:72px;letter-spacing:.04em;line-height:1}
.full .cn{font-size:26px;font-weight:800}
.lk{background:#fff;border-radius:18px;width:100%;padding:18px;display:flex;flex-direction:column;gap:8px;text-align:center}
.lk h3{color:#DC2626;font-size:16px;font-weight:700;margin:0}
.lk p{margin:0;font-size:14px;color:#475569;line-height:1.5}
.lf{text-align:left;display:flex;flex-direction:column;gap:3px}
.lf span{font-size:12.5px;font-weight:600;color:#475569}
.li{border:1.5px solid #E2E8F0;border-radius:10px;padding:9px 12px;font-size:14px;min-height:38px}
.lb{background:#DC2626;color:#fff;border-radius:12px;padding:13px;font-weight:700;font-size:14.5px;margin-top:4px}
.wp{background:#fff;border-radius:18px;width:100%;padding:24px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.wp .ic{width:96px;height:96px;border-radius:50%;background:#2563EB;color:#fff;display:grid;place-items:center}
.wp .t{font-size:24px;font-weight:800;color:#0F172A;line-height:1.2}
.wp .s{font-size:17px;font-weight:600;color:#475569}
.pbtn{background:#2563EB;color:#fff;font-weight:700;font-size:15px;padding:14px 18px;border-radius:999px;width:100%;text-align:center}
.pbtn.green{background:#059669}

.sl-n.k0{stroke:#2f7fb0}.sl-n.k1{stroke:var(--ok)}.sl-n.k2{stroke:var(--warn)}.sl-n.k3{stroke:var(--ng)}

<script>
(function(){

/* ---------- 3D scene ---------- */

  for(let s=0;s<pts.length-1;s++){const a=pts[s],b=pts[s+1];const L=Math.hypot(b[0]-a[0],b[1]-a[1]);const n=Math.floor(L/1.2);

})();

box(3,.1,3.1,0xb98d86,-.8,1,-11);
box(3,.1,3.4,0xc9a77c,-.8,1,-7.6);
[[-2.2,-12.4],[.6,-12.4],[-2.2,-5.9],[.6,-5.9],[-2.2,-9.3],[.6,-9.3]].forEach(p=>box(.1,1,.1,0x7a6347,p[0],.5,p[1]));

const monTex=canvasTex(256,160,(g,w,h)=>{g.fillStyle='#0b1220';g.fillRect(0,0,w,h);g.fillStyle='#2563eb';g.fillRect(0,0,w,34);g.fillStyle='#fff';g.font='bold 20px sans-serif';g.fillText('Weight Scale',10,24);g.fillStyle='#4ade80';g.font='bold 44px monospace';g.fillText('0.00 g',50,100);});

   PC tower under the table, blue platform scale with indicator pole, printer at the front-right */
[[-2.25,-10.05],[-2.25,-8.75]].forEach(p=>box(.06,.5,.06,0x9aa3ad,p[0],1.28,p[1]));

const monScr=new THREE.Mesh(new THREE.PlaneGeometry(.82,.47),new THREE.MeshBasicMaterial({map:monTex}));monScr.rotation.y=Math.PI/2;monScr.position.set(-2.01,1.99,-9.4);scene.add(monScr);
box(.35,.03,.7,0x20252c,-1.6,1.6,-9.4);

[[-1.35,-5.4],[-.45,-5.4],[-1.35,-4.6],[-.45,-4.6]].forEach(q=>box(.06,.8,.06,0xe8eaed,q[0],.4,q[1]));
box(1.0,.04,.9,0xcfd4da,-.9,.8,-5.0);box(1.0,.04,.9,0xcfd4da,-.9,.35,-5.0);
box(.95,.1,.75,0x2f55a4,-.9,.87,-5.0);
box(.06,.85,.06,0x8a929c,-1.3,1.35,-5.0);box(.14,.25,.42,0x9aa3ad,-1.3,1.9,-5.0);
(function(){const m=new THREE.Mesh(new THREE.PlaneGeometry(.34,.14),new THREE.MeshBasicMaterial({map:canvasTex(128,52,(g,w,h)=>{g.fillStyle='#0b1220';g.fillRect(0,0,w,h);g.fillStyle='#4ade80';g.font='bold 30px monospace';g.fillText('0.00',20,38);})}));m.rotation.y=Math.PI/2;m.position.set(-1.225,1.9,-5.0);scene.add(m);})();

box(.8,.8,.5,0x6b7480,-.9,.4,-4.05);box(.7,.4,.45,0x3b4350,-.9,1.0,-4.05);box(.4,.04,.25,0xffffff,-.9,1.22,-4.05);

const scalePos=V(-.9,1.09,-5.0);

box(.2,.04,.2,0x20252c,-1.0,1.07,-8.8);box(.05,.24,.05,0x20252c,-1.0,1.21,-8.8);box(.2,.1,.08,0x20252c,-.92,1.36,-8.8);box(.02,.06,.06,0xdd2222,-.82,1.36,-8.8);

  g.font='13px monospace';g.fillText('TST171120260005',12,50);for(let i=0;i<9;i++){g.fillStyle=i<2?'#2563eb':'#999';g.fillRect(12,70+i*20,w-24,8);}

const sheetRack=V(1,1.82,11.5), sheetTable=V(-.8,1.07,-7.2);

const CANCEL={};let runId=0,paused=false,speedMul=1,waiters=[];
const nf=()=>new Promise(r=>waiters.push(r));
async function dtf(id){for(;;){const dt=await nf();if(id!==runId)throw CANCEL;if(!paused)return dt*speedMul;}}
async function sleep(id,ms){let t=0;while(t<ms)t+=(await dtf(id))*1000;}
async function walk(id,w,x,z,mode,sp){
  w.mode=mode||'walk';sp=sp||3.4;
  for(;;){const dx=x-w.g.position.x,dz=z-w.g.position.z,d=Math.hypot(dx,dz);const dt=await dtf(id);const st=sp*dt;
    if(d>.01)w.heading=Math.atan2(dx,dz);
    if(d<=st){w.g.position.x=x;w.g.position.z=z;break;}
    w.g.position.x+=dx/d*st;w.g.position.z+=dz/d*st;w.phase+=dt*9*(sp/3.4);w.moving=true;}
  w.moving=false;
}
async function path(id,w,pts,mode,sp){for(const p of pts)await walk(id,w,p[0],p[1],mode,sp);}
async function turn(id,w,h){w.heading=h;await sleep(id,450);}
async function fly(id,obj,to,ms,arc){scene.attach(obj);const from=obj.position.clone();let t=0;
  while(t<1){t+=(await dtf(id))*1000/(ms||900);const k=Math.min(t,1),e=k*k*(3-2*k);obj.position.lerpVectors(from,to,e);obj.position.y+=Math.sin(k*Math.PI)*(arc==null?1.1:arc);}
  obj.position.copy(to);}
async function grab(id,obj,off){const tg=W.g.localToWorld(off.clone());await fly(id,obj,tg,650,.6);W.g.attach(obj);obj.position.copy(off);obj.rotation.set(0,0,0);obj.userData.carried=true;}
async function drop(id,obj,to,ms,arc){obj.userData.carried=false;await fly(id,obj,to,ms,arc);obj.rotation.set(0,0,0);}
async function spinCart(id,h){for(let i=0;i<30;i++){cart.rotation.y=angLerp(cart.rotation.y,h,.2);await sleep(id,20);}cart.rotation.y=h;}
function handPos(w){return w.hh.getWorldPosition(new THREE.Vector3());}

  w.mode='scan';await sleep(id,550);

async function saleWeigh(id,piece,sl,serial,grams,pickSpot){
  closeOn(TBLA,11);

  await sleep(id,400);
  setMarker(PRT[0],PRT[1]);note('เดินไปหยิบใบที่เครื่องพิมพ์');await walk(id,W,PRT[0],PRT[1],'walk',3.4);await turn(id,W,PRT[2]);

  await drop(id,ticket,deskTicket.clone(),700,.3);ticket.rotation.set(-Math.PI/2,0,0);W.mode='idle';await sleep(id,400);
  pcWin({st:'รอสแกนใบงานขาย'});note('ใช้เครื่องสแกนที่คอมสแกนใบงาน');await sleep(id,500);
  await deskScan(id,scanTip,deskTicket,1000);
  pcWin({scan:serial,st:'สแกน OK · วางชิ้นงานบนเครื่องชั่ง',ok:true});await sleep(id,600);
  note('สแกน OK แล้ว ทิ้งใบงานขายลงถังขยะใต้โต๊ะ');await grab(id,ticket,V(0,1.2,.5));W.mode='carry';await drop(id,ticket,trashIn.clone(),700,.3);ticket.visible=false;W.mode='idle';await sleep(id,500);
  if(pickSpot!==SS){setMarker(pickSpot[0],pickSpot[1]);note('ไปหยิบชิ้นที่ขาย');await walk(id,W,pickSpot[0],pickSpot[1],'walk',3.4);await turn(id,W,pickSpot[2]);}
  note('หยิบชิ้นที่ขายไปวางที่เครื่องชั่ง');await grab(id,piece,V(0,1.25,.55));W.mode='carry';setMarker(SCL[0],SCL[1]);closeOn(TBLA,11);
  await path(id,W,[[SS[0],-5.0],[SCL[0],SCL[1]]],'carry',3.4);await turn(id,W,SCL[2]);await drop(id,piece,scalePos.clone(),800,.4);W.mode='idle';
  pcWin({scan:serial,w:grams+' g',st:'น้ำหนักตรง · เครื่องชั่งพิมพ์ Assy Label',ok:true});await sleep(id,1200);
  closeOn(TBLA,11);note('Assy Label ออกจากเครื่องพิมพ์ข้างเครื่องชั่ง');

  pcHide();await sleep(id,800);

async function slideCart(id,x,z,ms){const x0=cart.position.x,z0=cart.position.z;let t=0;while(t<1){t+=(await dtf(id))*1000/(ms||900);const k=Math.min(t,1),e=k*k*(3-2*k);cart.position.x=x0+(x-x0)*e;cart.position.z=z0+(z-z0)*e;}}
const note=t=>{$('now').textContent=t||'';};
async function tap(id,sel){
  const sc=$('screen'),el=sc.querySelector(sel);if(!el)return;const sr=sc.getBoundingClientRect(),r=el.getBoundingClientRect(),f=$('finger');
  f.style.opacity=1;f.style.transform='translate('+((r.left-sr.left+r.width/2)/SC-22)+'px,'+((r.top-sr.top+r.height/2)/SC-22)+'px)';
  await sleep(id,620);f.classList.add('down');el.classList.add('pressed');await sleep(id,380);f.classList.remove('down');el.classList.remove('pressed');await sleep(id,150);f.style.opacity=0;
}

/* ---------- world state ---------- */
function place(o,x,y,z,ry){scene.add(o);o.position.set(x,y,z);o.rotation.set(0,ry||0,0);}
function tint(b,on){(b.userData.rods||[b.userData.body]).forEach(r=>r.material.emissive.set(on?0x0f7a35:0x000000));}
const H=Math.PI/2;
const WP=[1,9.4,0], SS=[1.5,-7.6,-H], RZ=[1.5,-11,-H], PICK=[1.15,-2.65,-H], F=[-15,.5,0], RET=[-2.25,-2.65,H], CUP=[-.55,-4.3,0], DN=[1.4,.3,-H], PW=[9.9,-8,H], SCL=[.2,-4.6,-H];
function setWorld(i){
  const wp=[[9,6.5,-2.2],SS,SS,SS,PICK,F,F,RET,RET,RET,SS,SS,DN,PW,RZ,RZ];
  const p=wp[i];
  [...W.g.children].filter(c=>c.userData&&c.userData.carried).forEach(c=>{c.userData.carried=false;scene.add(c);});
  W.g.position.set(p[0],0,p[1]);W.heading=p[2];W.g.rotation.y=p[2];W.mode='idle';W.moving=false;
  cartS.attached=(i>=4&&i<=6);
  if(cartS.attached)place(cart,p[0]+Math.sin(p[2])*1.7,0,p[1]+Math.cos(p[2])*1.7,p[2]);else place(cart,-.55,0,-2.65,-H);
  if(i<=5){place(crate1,crate1Rack.x,crate1Rack.y,crate1Rack.z,0);crate1.scale.set(1,1,1);}
  else{cart.add(crate1);crate1.position.copy(crate1Cart);crate1.rotation.set(0,H,0);crate1.scale.set(.58,1,1);}
  for(let k=0;k<3;k++){
    const mine=k<2;
    if(i<=5)place(B[k],bRack[k].x,bRack[k].y,bRack[k].z,Math.PI);
    else if(mine?(i>=6&&i<=9):(i>=6&&i<=15)){cart.add(B[k]);B[k].position.copy(bCart[k]);B[k].rotation.set(0,0,0);}
    else if(mine&&i>=10&&i<=12&&!(k===0&&i>=11))place(B[k],bTable[k].x,bTable[k].y,bTable[k].z,0);
    else if(k===0)place(B[0],dnB0.x,dnB0.y,dnB0.z,0);
    else place(B[k],bTable[k].x,bTable[k].y,bTable[k].z,0);
    tint(B[k],false);
  }
  B[1].visible=i<=11;

/* ---------- player ---------- */
let cur=0,finished=false;
const stepsEl=$('steps');
STEPS.forEach((s,i)=>{const li=document.createElement('li');const b=document.createElement('button');b.innerHTML='<span class="n">'+(i+1)+'</span><span>'+s.n+'</span>';b.addEventListener('click',()=>play(i));li.appendChild(b);stepsEl.appendChild(li);});
function ui(){
  [...stepsEl.children].forEach((li,i)=>{li.className=i<cur?'done':i===cur?'cur':'';});
  $('capT').textContent=(cur+1)+' · '+STEPS[cur].n;$('capD').textContent=STEPS[cur].d;
  $('bar').style.width=((cur+(finished?1:0))/STEPS.length*100)+'%';
  $('bPlay').textContent=finished?'↻ เล่นซ้ำ':paused?'▶ เล่นต่อ':'⏸ หยุด';
  const cb=stepsEl.children[cur];if(cb&&cb.scrollIntoView&&window.innerWidth<=900)try{cb.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
}
const SCREENS0=[()=>pgScan(''),()=>pgScan(''),()=>pgOLS(-1,0),()=>pgOLS(-1,0),()=>pgSFG(0,0),()=>pgSFG(0,0),()=>pgSFG(1,1),()=>pgSFG(1,1),()=>pgPrep(0,0),()=>pgPrep(0,0),()=>pgPrep(0,0),()=>pgPrep(0,0),()=>pgPrep(0,0),()=>pgPrep(1,0),()=>pgPrep(1,0),()=>pgPrep(1,0)];
async function play(i){
  const id=++runId;cur=i;finished=false;camOv=null;setWorld(i);SCREENS0[i]();note('');ui();
  try{await STEPS[i].run(id);await sleep(id,600);
    if(i<STEPS.length-1){play(i+1);}else{finished=true;note('จบขั้นตอนทั้งหมด');ui();}
  }catch(e){if(e!==CANCEL)console.error(e);}
}
$('bPrev').addEventListener('click',()=>play(Math.max(0,cur-1)));
$('bNext').addEventListener('click',()=>play(Math.min(STEPS.length-1,cur+1)));
$('bPlay').addEventListener('click',()=>{if(finished){play(0);return;}paused=!paused;ui();});
$('sp').addEventListener('change',e=>{speedMul=parseFloat(e.target.value);});

const EDGES=[['n1','n1b'],['n1b','n2'],['n2','n3'],['n3','n4'],['n4','n5','ไม่'],['n4','n6','ใช่'],['n6','n7'],['n7','n8'],['n8','n9'],['n9','n10'],['n10','n12','ถูก'],['n10','n13','ผิด/ซ้ำ'],['n13','n9','ปลดแล้วสแกนใหม่','R'],

function drawSwim(){
  const svg=$('swimSvg');if(!svg)return;
  const LW=230,HH=44,RH=86,NW=186,NH=54,rows=18,Wd=LW*4,Ht=HH+rows*RH;
  const cx=l=>l*LW+LW/2,cy=r=>HH+r*RH+RH/2;
  let s='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker></defs>';
  for(let l=0;l<4;l++){s+='<rect x="'+(l*LW)+'" y="0" width="'+LW+'" height="'+Ht+'" style="fill:var(--lane'+l+')"/><text class="sl-h" x="'+cx(l)+'" y="27" text-anchor="middle">'+LANES[l]+'</text>';
    if(l)s+='<line x1="'+(l*LW)+'" y1="0" x2="'+(l*LW)+'" y2="'+Ht+'" style="stroke:var(--line)"/>';}
  const info={};Object.keys(NODES).forEach(k=>{const n=NODES[k];info[k]={x:cx(n[0]),y:cy(n[1]),l:n[0],r:n[1],h:n[3]?64:NH,w:n[3]?NW+10:NW};});
  EDGES.forEach(e=>{
    const a=info[e[0]],b=info[e[1]];let d='',lx=0,ly=0,anchor='start';
    if(e[3]==='R'){const yt=a.y-a.h/2,xe=b.x+b.w/2;d='M'+a.x+' '+yt+'L'+a.x+' '+b.y+'L'+xe+' '+b.y;lx=(a.x+xe)/2;ly=b.y-6;anchor='middle';}
    else if(e[3]==='L'){const xa=a.x-a.w/2;d='M'+xa+' '+a.y+'L10 '+a.y+'L10 '+b.y+'L'+(b.x-b.w/2)+' '+b.y;lx=16;ly=a.y-6;}
    else if(a.r===b.r){const dir=b.x>a.x?1:-1;const x1=a.x+dir*a.w/2,x2=b.x-dir*b.w/2;d='M'+x1+' '+a.y+'L'+x2+' '+b.y;lx=(x1+x2)/2;ly=a.y-6;anchor='middle';}
    else if(b.r>a.r){const y1=a.y+a.h/2,y2=b.y-b.h/2,ym=(y1+y2)/2;d=a.x===b.x?'M'+a.x+' '+y1+'L'+b.x+' '+y2:'M'+a.x+' '+y1+'L'+a.x+' '+ym+'L'+b.x+' '+ym+'L'+b.x+' '+y2;lx=a.x+(b.x>a.x?10:-10);ly=y1+13;anchor=b.x>a.x?'start':'end';}
    else{const y1=a.y-a.h/2,y2=b.y+b.h/2,ym=(y1+y2)/2-12;const xo=b.x+22,x0=a.x+16;d='M'+x0+' '+y1+'L'+x0+' '+ym+'L'+xo+' '+ym+'L'+xo+' '+y2;lx=x0+6;ly=y1-6;}
    s+='<path class="sl-e" d="'+d+'" marker-end="url(#ah)"/>';
    if(e[2])s+='<text class="sl-l" x="'+lx+'" y="'+ly+'" text-anchor="'+anchor+'">'+e[2]+'</text>';
  });
  Object.keys(NODES).forEach(k=>{const n=NODES[k],i=info[k];
    if(n[3])s+='<polygon class="sl-n k'+n[0]+'" points="'+i.x+','+(i.y-i.h/2)+' '+(i.x+i.w/2)+','+i.y+' '+i.x+','+(i.y+i.h/2)+' '+(i.x-i.w/2)+','+i.y+'"/>';
    else s+='<rect class="sl-n k'+n[0]+'" x="'+(i.x-i.w/2)+'" y="'+(i.y-i.h/2)+'" width="'+i.w+'" height="'+i.h+'" rx="10"/>';
    const t=n[2];t.forEach((line,j)=>{s+='<text class="sl-t" x="'+i.x+'" y="'+(i.y+(j-(t.length-1)/2)*15+4)+'" text-anchor="middle">'+line+'</text>';});
  });
  svg.setAttribute('viewBox','0 0 '+Wd+' '+Ht);svg.innerHTML=s;
}

  if(v==='v3d'){paused=wasPaused;ui();resize();}
}
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{
  const was3d=!$('v3d').hidden;if(was3d&&b.dataset.v!=='v3d'){wasPaused=paused;paused=true;}
  showView(b.dataset.v);
}));

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const w=waiters;waiters=[];w.forEach(r=>r(dt));
  updW(W,paused?0:dt);if(SUP.g.visible)updW(SUP,paused?0:dt);
  if(cartS.attached){const h=W.g.rotation.y,k=1-Math.exp(-dt*9);
    cart.position.x+=(W.g.position.x+Math.sin(h)*1.7-cart.position.x)*k;cart.position.z+=(W.g.position.z+Math.cos(h)*1.7-cart.position.z)*k;cart.rotation.y=angLerp(cart.rotation.y,h,k);}
  if(marker.visible){const s=1+.15*Math.sin(now*.005);marker.scale.set(s,s,s);}
  if(!$('v3d').hidden){updCam(dt);projectLabels();renderer.render(scene,cam);}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
play(0);
})();
</script>
